apiVersion: v1
kind: PersistentVolume
metadata:
  name: virtual-waiting-room-postgres-storage
  labels:
    app.kubernetes.io/name: virtual-waiting-room-postgres
    app.kubernetes.io/part-of: virtual-waiting-room
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/sandbox-waiting-room/database
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - sandbox-server
