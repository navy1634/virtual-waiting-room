apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: virtual-waiting-room-postgres
  labels:
    app.kubernetes.io/name: virtual-waiting-room-postgres
    app.kubernetes.io/part-of: virtual-waiting-room
spec:
  serviceName: virtual-waiting-room-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: virtual-waiting-room-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: virtual-waiting-room-postgres
        app.kubernetes.io/part-of: virtual-waiting-room
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: waiting_room
            - name: POSTGRES_USER
              value: waiting_room
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: virtual-waiting-room-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - waiting_room
                - -d
                - waiting_room
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - waiting_room
                - -d
                - waiting_room
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - waiting_room
                - -d
                - waiting_room
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: virtual-waiting-room-postgres
